<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FileVault dashboard preview</title>
  <desc id="desc">Illustrative preview of the FileVault React dashboard with an upload panel and searchable file table.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f73ed"/><stop offset="1" stop-color="#6354d9"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f1f4ff"/><stop offset="1" stop-color="#fafbff"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#f7f9fc"/>
  <rect width="1440" height="72" fill="#fff"/>
  <path d="M0 71.5h1440" stroke="#e9edf3"/>
  <rect x="164" y="19" width="34" height="34" rx="10" fill="url(#brand)"/>
  <text x="175" y="42" fill="white" font-family="Arial,sans-serif" font-size="17" font-weight="700">F</text>
  <text x="208" y="42" fill="#152237" font-family="Arial,sans-serif" font-size="19" font-weight="700">FileVault</text>
  <circle cx="1158" cy="36" r="17" fill="#edf1ff"/>
  <text x="1153" y="41" fill="#4c61d2" font-family="Arial,sans-serif" font-size="13" font-weight="700">A</text>
  <text x="1184" y="40" fill="#617087" font-family="Arial,sans-serif" font-size="13">alex@example.com</text>
  <rect x="1300" y="18" width="82" height="38" rx="9" fill="white" stroke="#e6eaf0"/>
  <text x="1318" y="42" fill="#617087" font-family="Arial,sans-serif" font-size="12" font-weight="700">Sign out</text>
  <text x="190" y="151" fill="#6578d9" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">YOUR WORKSPACE</text>
  <text x="190" y="193" fill="#152237" font-family="Arial,sans-serif" font-size="34" font-weight="700">My files</text>
  <text x="190" y="220" fill="#8995a6" font-family="Arial,sans-serif" font-size="13">Keep everything important in one secure place.</text>
  <rect x="1244" y="170" width="138" height="43" rx="9" fill="#5268dc"/>
  <text x="1261" y="197" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="700">＋ Upload files</text>
  <rect x="190" y="253" width="1192" height="106" rx="13" fill="url(#panel)" stroke="#e2e7f4"/>
  <rect x="213" y="283" width="46" height="46" rx="12" fill="white" stroke="#dfe4fb"/>
  <text x="225" y="316" fill="#5369d9" font-family="Arial,sans-serif" font-size="25">↑</text>
  <text x="278" y="300" fill="#283750" font-family="Arial,sans-serif" font-size="14" font-weight="700">Add files to your vault</text>
  <text x="278" y="323" fill="#8995a6" font-family="Arial,sans-serif" font-size="13">Large files are sent in secure 5 MB chunks. Select one or more files to begin.</text>
  <text x="190" y="422" fill="#152237" font-family="Arial,sans-serif" font-size="20" font-weight="700">Files</text>
  <rect x="239" y="403" width="30" height="21" rx="10" fill="#edf0f5"/>
  <text x="249" y="418" fill="#718098" font-family="Arial,sans-serif" font-size="11" font-weight="700">3</text>
  <text x="190" y="447" fill="#8995a6" font-family="Arial,sans-serif" font-size="13">Manage your stored files and share links.</text>
  <rect x="1028" y="402" width="248" height="38" rx="8" fill="white" stroke="#e3e8ef"/>
  <text x="1041" y="426" fill="#9aa5b5" font-family="Arial,sans-serif" font-size="16">⌕</text>
  <text x="1064" y="425" fill="#a3adbb" font-family="Arial,sans-serif" font-size="12">Search files</text>
  <rect x="1287" y="402" width="95" height="38" rx="8" fill="white" stroke="#e3e8ef"/>
  <text x="1303" y="425" fill="#536174" font-family="Arial,sans-serif" font-size="12">Newest⌄</text>
  <rect x="190" y="467" width="1192" height="308" rx="12" fill="white" stroke="#e8ecf2"/>
  <path d="M190 510h1192" stroke="#edf0f4"/>
  <rect x="190" y="468" width="1192" height="42" rx="12" fill="#fcfcfd"/>
  <text x="211" y="494" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">NAME</text>
  <text x="915" y="494" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">SIZE</text>
  <text x="1035" y="494" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">ADDED</text>
  <text x="1192" y="494" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">ACTIONS</text>
  <g font-family="Arial,sans-serif">
    <rect x="211" y="525" width="34" height="36" rx="8" fill="#f0f2ff"/><text x="220" y="549" fill="#6376da" font-size="18">▧</text>
    <text x="256" y="547" fill="#293a52" font-size="12" font-weight="700">resume.pdf</text><text x="915" y="547" fill="#647286" font-size="12">2.3 MB</text><text x="1035" y="547" fill="#647286" font-size="12">Oct 08, 2026</text>
    <text x="1202" y="548" fill="#758299" font-size="19">↓</text><text x="1241" y="548" fill="#758299" font-size="17">↗</text><text x="1281" y="548" fill="#758299" font-size="20">×</text>
    <path d="M190 574h1192" stroke="#f0f2f5"/>
    <rect x="211" y="588" width="34" height="36" rx="8" fill="#f0f2ff"/><text x="220" y="612" fill="#6376da" font-size="18">▧</text>
    <text x="256" y="610" fill="#293a52" font-size="12" font-weight="700">project-notes.zip</text><text x="915" y="610" fill="#647286" font-size="12">14.0 MB</text><text x="1035" y="610" fill="#647286" font-size="12">Oct 07, 2026</text>
    <text x="1202" y="611" fill="#758299" font-size="19">↓</text><text x="1241" y="611" fill="#758299" font-size="17">↗</text><text x="1281" y="611" fill="#758299" font-size="20">×</text>
    <path d="M190 637h1192" stroke="#f0f2f5"/>
    <rect x="211" y="651" width="34" height="36" rx="8" fill="#f0f2ff"/><text x="220" y="675" fill="#6376da" font-size="18">▧</text>
    <text x="256" y="673" fill="#293a52" font-size="12" font-weight="700">portrait.png</text><text x="915" y="673" fill="#647286" font-size="12">800 KB</text><text x="1035" y="673" fill="#647286" font-size="12">Oct 06, 2026</text>
    <text x="1202" y="674" fill="#758299" font-size="19">↓</text><text x="1241" y="674" fill="#758299" font-size="17">↗</text><text x="1281" y="674" fill="#758299" font-size="20">×</text>
  </g>
  <path d="M190 732h1192" stroke="#f0f2f5"/>
  <text x="211" y="758" fill="#8995a6" font-family="Arial,sans-serif" font-size="11">Showing 1–3 of 3</text>
  <rect x="1264" y="740" width="55" height="30" rx="7" fill="white" stroke="#e6eaf0"/>
  <text x="1273" y="760" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="11">Previous</text>
  <rect x="1326" y="740" width="56" height="30" rx="7" fill="white" stroke="#e6eaf0"/>
  <text x="1341" y="760" fill="#617087" font-family="Arial,sans-serif" font-size="11">Next</text>
  <path d="M190 817h1192" stroke="#e9edf3"/>
  <text x="190" y="842" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="11">FileVault</text>
  <text x="1262" y="842" fill="#9aa5b4" font-family="Arial,sans-serif" font-size="11">Private storage, built for you.</text>
</svg>
